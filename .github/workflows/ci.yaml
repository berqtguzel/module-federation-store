name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Validate ${{ matrix.application }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - application: Host
            directory: apps/host
          - application: Products
            directory: apps/products
          - application: Basket
            directory: apps/basket

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ${{ matrix.directory }}/package-lock.json

      - name: Install dependencies
        working-directory: ${{ matrix.directory }}
        run: npm ci

      - name: Typecheck
        working-directory: ${{ matrix.directory }}
        run: npm run typecheck

      - name: Build
        working-directory: ${{ matrix.directory }}
        run: npm run build
